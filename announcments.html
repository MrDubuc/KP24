<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KIP24 Daily Announcements</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #073b78, #0b5aa8);
        color: white;
        min-height: 100vh;
    }

    header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(5, 43, 91, 0.96);
        padding: 24px 20px 20px;
        box-shadow: 0 3px 14px rgba(0,0,0,.25);
    }

    .wrap {
        width: min(1000px, calc(100% - 32px));
        margin: auto;
    }

    h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.2rem);
    }

    #today {
        margin-top: 8px;
        font-size: 1.1rem;
        opacity: .9;
    }

    main {
        padding: 28px 0 60px;
    }

    #status {
        margin-bottom: 18px;
        padding: 15px 18px;
        border-radius: 12px;
        background: rgba(255,255,255,.13);
        border: 1px solid rgba(255,255,255,.18);
    }

    #announcements {
        display: grid;
        gap: 18px;
    }

    .announcement {
        background: white;
        color: #172235;
        border-radius: 16px;
        padding: 24px 26px;
        box-shadow: 0 8px 24px rgba(0,0,0,.18);
        font-size: clamp(1.05rem, 2.2vw, 1.3rem);
        line-height: 1.55;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .number {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 34px;
        height: 34px;
        margin-right: 10px;
        border-radius: 50%;
        background: #e7f1ff;
        color: #07549d;
        font-weight: bold;
        font-size: .9rem;
        vertical-align: middle;
    }

    .empty,
    .error {
        padding: 28px;
        border-radius: 16px;
        text-align: center;
        line-height: 1.5;
        background: rgba(255,255,255,.14);
        border: 1px solid rgba(255,255,255,.2);
    }

    .error {
        background: white;
        color: #8b1e1e;
    }

    #debug {
        display: none;
        margin-top: 30px;
        padding: 20px;
        border-radius: 14px;
        background: rgba(0,0,0,.24);
        font-family: Consolas, monospace;
        font-size: .85rem;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    footer {
        padding: 0 0 28px;
        text-align: center;
        opacity: .7;
        font-size: .85rem;
    }
</style>
</head>

<body>

<header>
    <div class="wrap">
        <h1>Daily Announcements</h1>
        <div id="today">Loading date…</div>
    </div>
</header>

<main class="wrap">
    <div id="status">Loading today's announcements…</div>
    <section id="announcements"></section>
    <div id="debug"></div>
</main>

<footer class="wrap">
    KIP24 • Updated automatically from Google Sheets
</footer>

<script>

// ============================================================
// GOOGLE SHEET
// ============================================================

const SHEET_ID = "1qmXO0jiSEnqr7Wxl0c06i74aS37AQTNjteS53Il9vsE";
const SHEET_GID = "0";

// Refresh every five minutes.
const REFRESH_MS = 5 * 60 * 1000;


// ============================================================
// TODAY — TORONTO TIME
// ============================================================

function getTorontoToday() {

    // Optional testing:
    // page.html?date=2026-09-10
    const test = new URLSearchParams(location.search).get("date");

    if (test && /^\d{4}-\d{2}-\d{2}$/.test(test)) {
        const [year, month, day] = test.split("-").map(Number);
        return {year, month, day};
    }

    const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/Toronto",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    }).formatToParts(new Date());

    const p = {};

    for (const part of parts) {
        if (part.type !== "literal") p[part.type] = part.value;
    }

    return {
        year: Number(p.year),
        month: Number(p.month),
        day: Number(p.day)
    };
}

const TODAY = getTorontoToday();

function key(d) {
    return `${d.year}-${String(d.month).padStart(2,"0")}-${String(d.day).padStart(2,"0")}`;
}

const TODAY_KEY = key(TODAY);

function niceDate(d) {
    const fakeNoon = new Date(d.year, d.month - 1, d.day, 12);

    return new Intl.DateTimeFormat("en-CA", {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
    }).format(fakeNoon);
}

document.getElementById("today").textContent = niceDate(TODAY);


// ============================================================
// GENERAL HELPERS
// ============================================================

function clean(value) {
    return String(value ?? "")
        .replace(/\u00a0/g, " ")
        .replace(/\r\n/g, "\n")
        .trim();
}

function cellText(cell) {
    if (!cell) return "";

    // "f" is Google's formatted value and is especially useful for dates.
    if (cell.f !== undefined && cell.f !== null) return clean(cell.f);

    if (cell.v !== undefined && cell.v !== null) return clean(cell.v);

    return "";
}

function headerText(col) {
    return clean(col?.label || col?.id || "");
}


// ============================================================
// DATE PARSER
// ============================================================

function parseDate(value) {

    if (value === null || value === undefined || value === "") return null;

    let s = clean(value);

    // Google Visualization API date:
    // Date(2026,8,10)
    // Month is zero based.
    let m = s.match(/Date\(\s*(\d{4})\s*,\s*(\d{1,2})\s*,\s*(\d{1,2})/i);

    if (m) {
        return {
            year: Number(m[1]),
            month: Number(m[2]) + 1,
            day: Number(m[3])
        };
    }

    // 2026-09-10
    // 2026/09/10
    m = s.match(/(?:^|\D)(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})(?:\D|$)/);

    if (m) {
        return {
            year: Number(m[1]),
            month: Number(m[2]),
            day: Number(m[3])
        };
    }

    // 9/10/2026
    // 09-10-2026
    m = s.match(/(?:^|\D)(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})(?:\D|$)/);

    if (m) {
        return {
            year: Number(m[3]),
            month: Number(m[1]),
            day: Number(m[2])
        };
    }

    // Sep 10, 2026
    // September 10 2026
    const monthNames = {
        jan:1, january:1,
        feb:2, february:2,
        mar:3, march:3,
        apr:4, april:4,
        may:5,
        jun:6, june:6,
        jul:7, july:7,
        aug:8, august:8,
        sep:9, sept:9, september:9,
        oct:10, october:10,
        nov:11, november:11,
        dec:12, december:12
    };

    m = s.toLowerCase().match(
        /\b(january|jan|february|feb|march|mar|april|apr|may|june|jun|july|jul|august|aug|september|sept|sep|october|oct|november|nov|december|dec)\s+(\d{1,2})(?:st|nd|rd|th)?[,]?\s+(\d{4})\b/
    );

    if (m) {
        return {
            year: Number(m[3]),
            month: monthNames[m[1]],
            day: Number(m[2])
        };
    }

    return null;
}

function cellDate(cell) {

    if (!cell) return null;

    // Try formatted version first.
    let parsed = parseDate(cell.f);

    if (parsed) return parsed;

    // Then raw Google value.
    parsed = parseDate(cell.v);

    return parsed;
}

function isTodayDate(cell) {
    const d = cellDate(cell);
    return d && key(d) === TODAY_KEY;
}


// ============================================================
// FIND ANNOUNCEMENT COLUMN
// ============================================================

function findAnnouncementColumn(cols, rows) {

    const words = [
        "announcement",
        "announcements",
        "announcement text",
        "message",
        "details",
        "description",
        "content"
    ];

    // Prefer a named announcement column.
    for (let i = 0; i < cols.length; i++) {

        const heading = headerText(cols[i]).toLowerCase();

        if (words.some(word => heading.includes(word))) {
            return i;
        }
    }

    // Fallback: use the column with the greatest amount of long text.
    let best = -1;
    let bestScore = 0;

    for (let c = 0; c < cols.length; c++) {

        let score = 0;

        for (const row of rows) {
            const text = cellText(row?.c?.[c]);

            if (text.length > 25 && !parseDate(text)) {
                score += text.length;
            }
        }

        if (score > bestScore) {
            bestScore = score;
            best = c;
        }
    }

    return best;
}


// ============================================================
// FIND ALL DATE COLUMNS
// ============================================================

function findDateValueColumns(cols, rows, announcementColumn) {

    const indexes = [];

    for (let c = 0; c < cols.length; c++) {

        if (c === announcementColumn) continue;

        const heading = headerText(cols[c]).toLowerCase();

        // A heading such as:
        // Date
        // Date 1
        // Date 2
        // Announcement Date
        // Run Date
        const headingLooksLikeDate =
            heading.includes("date") ||
            heading.includes("day");

        let dateCount = 0;
        let populatedCount = 0;

        // Inspect a generous sample from this column.
        for (let r = 0; r < Math.min(rows.length, 100); r++) {

            const cell = rows[r]?.c?.[c];

            if (!cell) continue;

            const text = cellText(cell);

            if (text !== "") populatedCount++;

            if (cellDate(cell)) dateCount++;
        }

        // Include:
        // 1. Any column explicitly named as a date column
        // OR
        // 2. Any column whose actual contents clearly contain dates.
        if (
            headingLooksLikeDate ||
            dateCount >= 2 ||
            (dateCount >= 1 && populatedCount <= 5)
        ) {
            indexes.push(c);
        }
    }

    return indexes;
}


// ============================================================
// ALSO SUPPORT DATE-AS-COLUMN-HEADING SHEETS
// ============================================================

function todayHeaderColumns(cols) {

    const result = [];

    for (let c = 0; c < cols.length; c++) {

        const d = parseDate(headerText(cols[c]));

        if (d && key(d) === TODAY_KEY) {
            result.push(c);
        }
    }

    return result;
}

function cellIsMarked(cell) {

    if (!cell) return false;

    if (cell.v === true) return true;
    if (cell.v === false) return false;

    const text = cellText(cell).toLowerCase();

    if (!text) return false;

    return ![
        "false",
        "no",
        "n",
        "0",
        "off",
        "unchecked"
    ].includes(text);
}


// ============================================================
// DETERMINE WHETHER A ROW RUNS TODAY
// ============================================================

function rowRunsToday(row, dateColumns, dateHeaderColumns) {

    const cells = row.c || [];

    // MODEL 1
    // Date 1 | Date 2 | Date 3 ...
    // Each row stores one or more actual dates.
    for (const c of dateColumns) {

        if (isTodayDate(cells[c])) {
            return true;
        }
    }

    // MODEL 2
    // Sep 9 | Sep 10 | Sep 11 ...
    // The date is the COLUMN HEADING and the row is marked underneath it.
    for (const c of dateHeaderColumns) {

        if (cellIsMarked(cells[c])) {
            return true;
        }
    }

    return false;
}


// ============================================================
// DISPLAY
// ============================================================

function display(items) {

    const status = document.getElementById("status");
    const area = document.getElementById("announcements");

    area.innerHTML = "";

    if (!items.length) {

        status.style.display = "none";

        area.innerHTML =
            `<div class="empty">
                No announcements were found for ${niceDate(TODAY)}.
            </div>`;

        return;
    }

    status.style.display = "block";
    status.textContent =
        `${items.length} announcement${items.length === 1 ? "" : "s"} for today`;

    items.forEach((text, index) => {

        const card = document.createElement("article");
        card.className = "announcement";

        const number = document.createElement("span");
        number.className = "number";
        number.textContent = index + 1;

        const copy = document.createElement("span");
        copy.textContent = text;

        card.append(number, copy);
        area.appendChild(card);
    });
}

function showError(message) {

    document.getElementById("status").style.display = "none";

    document.getElementById("announcements").innerHTML =
        `<div class="error">${message}</div>`;
}


// ============================================================
// DEBUG OPTION
// ============================================================

function debugReport(cols, announcementColumn, dateColumns, dateHeaderColumns, rows) {

    if (new URLSearchParams(location.search).get("debug") !== "1") return;

    const box = document.getElementById("debug");
    box.style.display = "block";

    const columnNames = cols.map((c, i) =>
        `${String.fromCharCode(65 + (i % 26))} (${i}): ${headerText(c) || "[blank heading]"}`
    );

    const todaysMatches = [];

    rows.forEach((row, r) => {

        const matching = [];

        dateColumns.forEach(c => {
            if (isTodayDate(row?.c?.[c])) matching.push(c);
        });

        if (matching.length) {
            todaysMatches.push(
                `Row ${r + 2}: matched date column(s) ${matching.join(", ")}`
            );
        }
    });

    box.textContent =
`DEBUG MODE

Target date:
${TODAY_KEY}

Announcement column:
${announcementColumn}

Date-value columns:
${dateColumns.join(", ") || "none"}

Today-as-heading columns:
${dateHeaderColumns.join(", ") || "none"}

Columns:
${columnNames.join("\n")}

Rows matching today:
${todaysMatches.join("\n") || "none"}`;
}


// ============================================================
// GOOGLE SHEET CALLBACK
// ============================================================

window.handleSheetResponse = function(response) {

    try {

        if (!response || response.status === "error" || !response.table) {

            showError(
                "The Google Sheet could not be read. Make sure the sheet can be viewed by anyone with the link."
            );

            return;
        }

        const cols = response.table.cols || [];
        const rows = response.table.rows || [];

        const announcementColumn =
            findAnnouncementColumn(cols, rows);

        if (announcementColumn < 0) {

            showError(
                "The sheet loaded, but the announcement column could not be identified."
            );

            return;
        }

        // IMPORTANT:
        // There may be MORE THAN ONE date column.
        const dateColumns =
            findDateValueColumns(cols, rows, announcementColumn);

        const dateHeaderColumns =
            todayHeaderColumns(cols);

        const found = [];

        for (const row of rows) {

            if (!rowRunsToday(row, dateColumns, dateHeaderColumns)) continue;

            const announcement =
                cellText(row?.c?.[announcementColumn]);

            if (announcement) {
                found.push(announcement);
            }
        }

        // Remove duplicate announcement text.
        const seen = new Set();

        const unique = found.filter(text => {

            const normalized =
                text.toLowerCase().replace(/\s+/g, " ").trim();

            if (seen.has(normalized)) return false;

            seen.add(normalized);
            return true;
        });

        display(unique);

        debugReport(
            cols,
            announcementColumn,
            dateColumns,
            dateHeaderColumns,
            rows
        );

    }

    catch (err) {

        console.error(err);

        showError(
            "The sheet loaded, but there was a problem reading the announcement/date columns."
        );
    }
};


// ============================================================
// LOAD GOOGLE SHEET
// ============================================================

function loadSheet() {

    const previous =
        document.getElementById("google-sheet-data");

    if (previous) previous.remove();

    const script =
        document.createElement("script");

    script.id = "google-sheet-data";

    const params = new URLSearchParams({
        gid: SHEET_GID,
        headers: "1",
        tqx: "responseHandler:handleSheetResponse",
        cacheBust: Date.now()
    });

    script.src =
        `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?${params}`;

    script.onerror = () => {

        showError(
            "Unable to connect to the Google Sheet."
        );
    };

    document.head.appendChild(script);
}

loadSheet();

setInterval(loadSheet, REFRESH_MS);

</script>

</body>
</html>
