<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #f0f6fc;
        }

        p {
            color: #8b949e;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .hub-btn {
            display: block;
            padding: 1rem 1.5rem;
            font-size: 1.05rem;
            font-weight: 600;
            text-decoration: none;
            color: #ffffff;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .hub-btn:hover {
            background-color: #238636;
            border-color: #2ea043;
            transform: translateY(-2px);
        }

        .hub-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Directory Hub</h1>
        <p>Select a page to navigate to:</p>

        <div class="button-grid">
            <a href="announcements.html" class="hub-btn">Announcements</a>
            <a href="calendar3.html" class="hub-btn">Calendar</a>
            <a href="labmapperweb.html" class="hub-btn">Lab Mapper</a>
            <a href="KP24.html" class="hub-btn">KP24</a>
        </div>
    </div>

</body>
</html>
